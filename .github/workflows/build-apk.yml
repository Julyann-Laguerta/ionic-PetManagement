name: Build Ionic Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-apk:

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # 1. Get the source code
      # ----------------------------------------------------------
      - name: Checkout project
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # 2. Install Node.js
      # ----------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'


      # ----------------------------------------------------------
      # 3. Install project dependencies
      # ----------------------------------------------------------
      - name: Install npm dependencies
        run: npm ci


      # ----------------------------------------------------------
      # Firebase environment variables
      # ----------------------------------------------------------
      - name: Create Firebase environment file
        env:
          FIREBASE_ENV: ${{ secrets.FIREBASE_ENV }}
        run: |
          printf '%s\n' "$FIREBASE_ENV" > .env

      - name: Verify Firebase environment
        run: |
          node - <<'NODE'
          const fs = require('fs');

          const required = [
            'VITE_FIREBASE_API_KEY',
            'VITE_FIREBASE_AUTH_DOMAIN',
            'VITE_FIREBASE_DATABASE_URL',
            'VITE_FIREBASE_PROJECT_ID',
            'VITE_FIREBASE_STORAGE_BUCKET',
            'VITE_FIREBASE_MESSAGING_SENDER_ID',
            'VITE_FIREBASE_APP_ID'
          ];

          const lines = fs.readFileSync('.env', 'utf8').split(/\r?\n/);
          const env = {};

          for (const line of lines) {
            const i = line.indexOf('=');
            if (i > 0) {
              env[line.slice(0, i)] = line.slice(i + 1);
            }
          }

          for (const key of required) {
            if (!env[key]) {
              console.log(`${key}: MISSING`);
            } else {
              console.log(`${key}: present (${env[key].length} characters)`);
            }
          }
          NODE
          
      # ----------------------------------------------------------
      # 4. Build Ionic/Vue application
      # ----------------------------------------------------------
      - name: Build Ionic application
        run: npm run build


      # ----------------------------------------------------------
      # 5. Install Java 21
      # IMPORTANT:
      # Capacitor Android currently compiles with Java 21.
      # ----------------------------------------------------------
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'


      # ----------------------------------------------------------
      # 6. Confirm Java version
      # ----------------------------------------------------------
      - name: Check Java version
        run: |
          java -version
          javac -version
          echo "JAVA_HOME=$JAVA_HOME"


      # ----------------------------------------------------------
      # 7. Synchronize Capacitor with Android
      # ----------------------------------------------------------
      - name: Sync Capacitor Android
        run: npx cap sync android


      # ----------------------------------------------------------
      # 8. Give Gradle execution permission
      # ----------------------------------------------------------
      - name: Make Gradle executable
        run: chmod +x android/gradlew


      # ----------------------------------------------------------
      # 9. Check Gradle environment
      # ----------------------------------------------------------
      - name: Check Gradle version
        working-directory: android
        run: ./gradlew --version


      # ----------------------------------------------------------
      # 10. Build debug APK
      # ----------------------------------------------------------
      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug


      # ----------------------------------------------------------
      # 11. Rename the generated APK
      # ----------------------------------------------------------
      - name: PetInformationManager.apk
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk PetInformationManager.apk


      # ----------------------------------------------------------
      # 12. Upload APK to GitHub Actions
      # ----------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PetInformationManager-APK
          path: PetInformationManager.apk
          if-no-files-found: error
          retention-days: 30